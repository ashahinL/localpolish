<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LocalPolish fixtures</title>
    <style>
      textarea,
      input,
      #ce,
      #other,
      #draft,
      #lexical {
        display: block;
        width: 400px;
        margin: 8px;
      }
      textarea,
      #ce,
      #other,
      #lexical,
      #draft .public-DraftEditor-content {
        min-height: 48px;
      }
      #ce,
      #other,
      #draft,
      #lexical {
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <textarea id="ta"></textarea>
    <div spellcheck="false"><textarea id="ta-nospell"></textarea></div>
    <div spellcheck="false"><textarea id="ta-spell-on" spellcheck="true"></textarea></div>
    <input id="inp" type="text" />
    <input id="email" type="email" />
    <div id="ce" contenteditable="true"></div>
    <div id="draft"></div>
    <div id="lexical" contenteditable="true"></div>
    <div id="other" contenteditable="true">Other editor original text</div>
    <button id="outside" type="button">Outside</button>
    <dialog id="dlg"><textarea id="dlg-ta"></textarea></dialog>
    <script type="module" src="./main.js"></script>
  </body>
</html>
